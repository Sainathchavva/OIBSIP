<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <header class="app-header">
            <h1>My To-Do List</h1>
            <p>Plan your day, complete your tasks.</p>
        </header>

        <!-- Add Task Section -->
        <section class="task-input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
                maxlength="100"
            >

            <button id="addTaskBtn">Add Task</button>
        </section>

        <!-- Task Lists -->
        <section class="lists-container">

            <!-- Pending Tasks -->
            <div class="task-section">
                <div class="section-heading">
                    <h2>Pending Tasks</h2>
                    <span id="pendingCount">0 pending</span>
                </div>

                <div id="pendingList" class="task-list">
                    <p class="empty-message">
                        No pending tasks. You're all caught up!
                    </p>
                </div>
            </div>

            <!-- Completed Tasks -->
            <div class="task-section completed-section">
                <div class="section-heading">
                    <h2>Completed Tasks</h2>
                    <span id="completedCount">0 completed</span>
                </div>

                <div id="completedList" class="task-list">
                    <p class="empty-message">
                        Completed tasks will appear here.
                    </p>
                </div>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
